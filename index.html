<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>綠途 LUTU - 真實 App 版</title>
    
    <link rel="icon" href="logo.jpg">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --primary: #55a846; --primary-dark: #3e8e2e; 
            --bg-mint: #cde6d5; --bg-brown: #a87e5b; 
            --text-dark: #333; 
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #222; margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }

        #app-container {
            width: 390px; height: 844px;
            background-color: var(--bg-mint);
            position: relative; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 40px; border: 8px solid #111;
            display: flex; flex-direction: column;
        }

        /* --- 頂部狀態列 --- */
        .top-bar { padding: 40px 20px 10px; z-index: 10; background: var(--bg-mint); }
        .points-pill {
            background: rgba(255, 255, 255, 0.5); border: 2px solid var(--primary-dark);
            border-radius: 20px; padding: 5px 15px; display: flex; align-items: center;
            justify-content: space-between; font-weight: bold; font-size: 18px; color: #111;
            margin-bottom: 15px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }
        .points-pill i { color: white; background: var(--primary); border-radius: 50%; padding: 4px; font-size: 14px; }
        .exp-section { display: flex; align-items: center; justify-content: space-between; font-weight: bold; font-size: 14px; position: relative;}
        .lv-text { font-size: 22px; font-weight: 900; color: #333; margin-right: 10px; }
        .exp-bar-container { flex: 1; background: #666; height: 12px; border-radius: 6px; overflow: hidden; position: relative; }
        #mascot-exp-bar { height: 100%; background: var(--primary); width: 0%; transition: 0.5s; }
        .exp-text { font-size: 12px; text-align: right; margin-top: 5px; color: #333; position: absolute; right: 0; top: 15px; }

        /* --- 分頁系統 --- */
        .tab-content { flex: 1; display: none; overflow-y: auto; padding-bottom: 80px; }
        .tab-content.active { display: flex; flex-direction: column; }

        /* 🏠 首頁 Tab */
        #tab-home { background: var(--bg-mint); position: relative; overflow: hidden; }
        .mascot-area { flex: 1; display: flex; justify-content: center; align-items: center; z-index: 5; margin-bottom: 150px; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-15px); } 100% { transform: translateY(0px); } }
        #mascot-img { width: 280px; height: auto; object-fit: contain; animation: float 4s ease-in-out infinite; }
        
        .side-buttons { position: absolute; right: 15px; top: 130px; display: flex; flex-direction: column; gap: 12px; z-index: 20; }
        .side-btn { width: 45px; height: 45px; background: white; border: 2px solid var(--primary); border-radius: 12px; font-size: 20px; color: var(--primary-dark); cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.15); display: flex; justify-content: center; align-items: center; }

        .ground-area { position: absolute; bottom: 0; width: 100%; height: 210px; background-color: var(--bg-brown); z-index: 1; border-top: 10px solid #7a5a3e; }
        .action-buttons { position: absolute; bottom: 95px; width: 100%; display: flex; justify-content: center; gap: 12px; padding: 0 15px; box-sizing: border-box; z-index: 10; }
        
        .action-btn { background: white; border-radius: 15px; width: 105px; height: 95px; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: 0 4px 8px rgba(0,0,0,0.2); cursor: pointer; border: none; }
        .action-btn i { font-size: 32px; color: var(--primary); margin-bottom: 8px; }
        .action-btn span { font-size: 13px; font-weight: bold; color: var(--primary-dark); }

        /* 底部導覽列 */
        .bottom-nav { position: absolute; bottom: 0; width: 100%; height: 75px; background: white; display: flex; justify-content: space-around; align-items: center; box-shadow: 0 -2px 15px rgba(0,0,0,0.1); border-bottom-left-radius: 32px; border-bottom-right-radius: 32px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #bbb; font-size: 12px; cursor: pointer; gap: 4px; width: 60px; }
        .nav-item.active { color: var(--primary); font-weight: bold; }
        .nav-item i { font-size: 24px; }

        /* 元件樣式 */
        select, input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
        button.btn-primary { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; font-size: 15px; cursor: pointer;}
        #map { width: 100%; height: 280px; border-radius: 12px; border: 2px solid #ddd; margin: 10px 0; z-index: 1; }
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

        .modal-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 200; justify-content: center; align-items: center; border-radius: 32px; }
        .modal-content { background: white; padding: 20px; border-radius: 16px; width: 85%; max-height: 80%; overflow-y: auto; position: relative; box-sizing: border-box; }
        .close-btn { position: absolute; top: 10px; right: 15px; background: none; border: none; font-size: 24px; color: #888; }
        
        .rank-item { display: flex; justify-content: space-between; padding: 10px 5px; border-bottom: 1px solid #eee; font-size: 14px;}
        .friend-item { display: flex; justify-content: space-between; align-items: center; background: #f9f9f9; padding: 10px; margin-bottom: 8px; border-radius: 8px; }
        .task-item { background: #fff; border: 1px solid #eee; padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <div id="app-container">
        <div class="top-bar">
            <div class="points-pill">
                <i class="fa-solid fa-leaf"></i>
                <span id="points-display-main">0</span>
            </div>
            <div class="exp-section">
                <div id="mascot-name" class="lv-text">LV1</div>
                <div class="exp-bar-container">
                    <div id="mascot-exp-bar"></div>
                </div>
                <div id="mascot-exp-text" class="exp-text">EX 0/100</div>
            </div>
        </div>

        <div id="tab-home" class="tab-content active">
            <div class="mascot-area">
                <img id="mascot-img" src="rabbit.png" alt="LUTU 兔兔" onerror="this.src='https://dummyimage.com/280x300/cde6d5/3e8e2e.png&text=請放入去背圖'">
            </div>
            <div class="side-buttons">
                <button class="side-btn" onclick="openLeaderboard()"><i class="fa-solid fa-trophy"></i></button>
                <button class="side-btn" onclick="openFriends()"><i class="fa-solid fa-user-group"></i></button>
            </div>
            <div class="ground-area"></div>
            <div class="action-buttons">
                <button class="action-btn" onclick="openModal('itinerary-modal')"><i class="fa-solid fa-book-open"></i><span>旅行手冊</span></button>
                <button class="action-btn" onclick="openModal('task-modal')"><i class="fa-solid fa-medal"></i><span>在地任務</span></button>
                <button class="action-btn" onclick="openModal('wardrobe-modal')"><i class="fa-solid fa-shirt"></i><span>服飾道具</span></button>
            </div>
        </div>

        <div id="tab-explore" class="tab-content">
            <div style="padding:15px">
                <h3 style="color:var(--primary-dark);margin:0 0 10px 0">探索地圖</h3>
                <div id="map"></div>
                <div class="card">
                    <input type="text" id="location-search" placeholder="🔍 搜尋目的地...">
                    <button class="btn-primary" style="margin-top:10px" onclick="searchLocation()">定位</button>
                    <button class="btn-primary" style="background:#1976D2;margin-top:10px" onclick="calculateMultiStopRoute()">規劃路線</button>
                    <hr>
                    <select id="gps-waypoint-select" disabled onchange="updateGPSButtonState()"><option>請先規劃...</option></select>
                    <button id="btn-gps-arrive" class="btn-primary" style="background:#aaa" onclick="simulateArrivalAndReward()" disabled>抵達結算</button>
                </div>
            </div>
        </div>

        <div id="tab-shop" class="tab-content">
            <div style="padding:15px">
                <h3 style="color:#1976D2">商城</h3>
                <div style="background:#fff9c4;padding:15px;border-radius:12px;text-align:center;margin-bottom:15px">
                    💰 旅遊金：<span id="wallet-display">0</span> 元
                </div>
                <div id="shop-list-container"></div>
            </div>
        </div>

        <div id="tab-profile" class="tab-content">
            <div style="padding:15px">
                <div id="auth-section">
                    <h3>會員登入</h3>
                    <input type="email" id="auth-email" placeholder="Email">
                    <input type="password" id="auth-password" placeholder="密碼">
                    <button class="btn-primary" style="margin-top:10px" onclick="handleLogin()">登入</button>
                    <button class="btn-primary" style="background:#1976D2;margin-top:10px" onclick="handleSignup()">註冊</button>
                </div>
                <div id="user-info-section" style="display:none">
                    <h3 id="profile-nickname">你好</h3>
                    <button class="btn-primary" style="background:#d32f2f" onclick="handleLogout()">登出</button>
                    <hr>
                    <h4>我的背包</h4>
                    <div id="mailbox-container"></div>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchTab('home')"><i class="fa-solid fa-house"></i><span>首頁</span></div>
            <div class="nav-item" onclick="switchTab('explore')"><i class="fa-solid fa-compass"></i><span>探索</span></div>
            <div class="nav-item" onclick="switchTab('shop')"><i class="fa-solid fa-cart-shopping"></i><span>商城</span></div>
            <div class="nav-item" onclick="switchTab('profile')"><i class="fa-solid fa-user"></i><span id="nav-user-text">個人</span></div>
        </div>

        <div class="modal-overlay" id="leaderboard-modal"><div class="modal-content"><button class="close-btn" onclick="closeModal('leaderboard-modal')">×</button><h3>排行榜</h3><div id="leaderboard-list"></div></div></div>
        <div class="modal-overlay" id="friends-modal"><div class="modal-content"><button class="close-btn" onclick="closeModal('friends-modal')">×</button><h3>好友</h3><div id="friend-list-container"></div></div></div>
        <div class="modal-overlay" id="task-modal"><div class="modal-content"><button class="close-btn" onclick="closeModal('task-modal')">×</button><h3>在地任務</h3><div id="task-list-container"></div></div></div>
        <div class="modal-overlay" id="itinerary-modal"><div class="modal-content"><button class="close-btn" onclick="closeModal('itinerary-modal')">×</button><h3>手冊</h3><div id="itinerary-list-display"></div></div></div>
        <div class="modal-overlay" id="wardrobe-modal"><div class="modal-content"><button class="close-btn" onclick="closeModal('wardrobe-modal')">×</button><h3>衣櫥</h3><div class="wardrobe-grid"><div class="wardrobe-slot active">基本款</div></div></div></div>
        <div class="modal-overlay" id="barcode-modal"><div class="modal-content"><h4 id="barcode-title"></h4><div style="background:#333;height:60px"></div><button class="btn-primary" onclick="confirmConsumeTicket()">核銷</button></div></div>
        <div class="modal-overlay" id="qr-scanner-modal"><div class="modal-content"><h3>掃描 QR</h3><button class="btn-primary" onclick="simulateTaskSuccess()">模擬成功</button></div></div>
    </div>

    <script>
        // --- 1. 初始化區 ---
        const SUPABASE_URL = 'https://vwoeztbwollawwojnmgz.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_0dJ9RgOdwdkCp9g648JyLA_yQ9q7Dtb';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let userPoints = 0; // 碳幣
        let userExp = 0;    // 總經驗值 (決定等級)
        let inventory = {};
        let myFriends = [];
        let isSyncing = false; // 🌟 新增：防止同步循環

        // --- 2. 存取邏輯 (本地+雲端) ---
        function saveLocalData() {
            localStorage.setItem('lutu_data', JSON.stringify({ points: userPoints, exp: userExp, inv: inventory, friends: myFriends }));
        }

        function loadLocalData() {
            const saved = localStorage.getItem('lutu_data');
            if(saved) {
                const d = JSON.parse(saved);
                userPoints = d.points || 0;
                userExp = d.exp || 0;
                inventory = d.inv || {};
                myFriends = d.friends || [];
            }
            refreshUI();
        }

        // 🌟 核心修正：登入時強制抓取雲端，並停用本地覆蓋
        async function fetchUserData(username) {
            isSyncing = true; // 暫時關閉自動同步，避免把 0 分寫回雲端
            const { data, error } = await supabaseClient.from('users').select('*').eq('username', username).single();
            
            if (data) {
                console.log("📥 從雲端抓取成功：", data);
                userPoints = data.green_points || 0;
                userExp = data.exp || 0;
                inventory = data.inventory || {};
                myFriends = data.friends || [];
                saveLocalData(); // 更新本地
            } else {
                console.log("🆕 新用戶，建立雲端資料...");
                await supabaseClient.from('users').insert([{ username: username, green_points: userPoints, exp: userExp, inventory: inventory }]);
            }
            isSyncing = false;
            refreshUI();
        }

        async function syncDataToCloud() {
            saveLocalData();
            if(!currentUser || isSyncing) return;
            
            const t = currentUser.email.split('@')[0];
            const { error } = await supabaseClient.from('users').update({ 
                green_points: userPoints, 
                exp: userExp, 
                inventory: inventory,
                friends: myFriends
            }).eq('username', t);
            
            if(!error) console.log("☁️ 雲端同步完成");
            else console.error("❌ 雲端存檔失敗：", error.message);
        }

        // --- 3. 升級公式 ---
        function updateMascot() {
            const reqXpList = [100, 250, 600, 1500, 3750, 9375];
            let lv = 1, currentReq = reqXpList[0], startXp = 0;
            for (let i = 0; i < 99; i++) {
                currentReq = i < reqXpList.length ? reqXpList[i] : Math.floor(currentReq * 2.5);
                if (userExp >= startXp + currentReq) { startXp += currentReq; lv++; } else break;
            }
            const prog = ((userExp - startXp) / currentReq) * 100;
            document.getElementById('points-display-main').innerText = userPoints;
            document.getElementById('mascot-name').innerText = `LV${lv}`;
            document.getElementById('mascot-exp-bar').style.width = Math.min(prog, 100) + '%';
            document.getElementById('mascot-exp-text').innerText = `EX ${userExp - startXp}/${currentReq}`;
        }

        // --- 4. 登入系統 ---
        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (session) {
                currentUser = session.user;
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('user-info-section').style.display = 'block';
                document.getElementById('profile-nickname').innerText = "你好, " + currentUser.email.split('@')[0];
                fetchUserData(currentUser.email.split('@')[0]);
            } else {
                currentUser = null;
                document.getElementById('auth-section').style.display = 'block';
                document.getElementById('user-info-section').style.display = 'none';
                loadLocalData(); // 登出後切換到本地
            }
        });

        async function handleLogin() {
            const e = document.getElementById('auth-email').value, p = document.getElementById('auth-password').value;
            const { error } = await supabaseClient.auth.signInWithPassword({ email: e, password: p });
            if(error) alert("錯誤：" + error.message);
        }

        async function handleSignup() {
            const e = document.getElementById('auth-email').value, p = document.getElementById('auth-password').value;
            const { error } = await supabaseClient.auth.signUp({ email: e, password: p });
            if(!error) alert("註冊成功，請收信認證");
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            userPoints = 0; userExp = 0; inventory = {}; myFriends = [];
            localStorage.removeItem('lutu_data'); // 徹底清空
            refreshUI();
            alert("已登出並重置資料");
        }

        // --- 5. 功能區 ---
        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
            document.getElementById('tab-'+id).classList.add('active');
            if(id==='explore') setTimeout(()=>map.invalidateSize(), 200);
            refreshUI();
        }

        function refreshUI() {
            updateMascot();
            document.getElementById('wallet-display').innerText = Math.floor(userPoints/10);
            renderMailbox();
        }

        const SHOP_ITEMS = [{ name: "民宿 $200 折抵", cost: 200, icon: "🏨" }, { name: "門票 $100 折抵", cost: 100, icon: "🏞️" }, { name: "YouBike 100元", cost: 100, icon: "🚲" }];
        function renderShop() {
            const c = document.getElementById('shop-list-container');
            c.innerHTML = '';
            SHOP_ITEMS.forEach(i => {
                c.innerHTML += `<div class="shop-item"><div>${i.icon} ${i.name}</div><button class="btn-primary" style="width:auto;padding:5px 15px" onclick="buyItem(${i.cost},'${i.name}','${i.icon}')">${i.cost}元</button></div>`;
            });
        }
        function buyItem(cost, name, icon) {
            if(userPoints < cost*10) return alert("碳幣不足！");
            userPoints -= cost*10;
            inventory[name] = (inventory[name] || 0) + 1;
            syncDataToCloud(); refreshUI(); alert("兌換成功");
        }

        function renderMailbox() {
            const c = document.getElementById('mailbox-container');
            if(!c) return;
            const keys = Object.keys(inventory);
            c.innerHTML = keys.length ? '' : '背包空空的';
            keys.forEach(k => {
                c.innerHTML += `<div class="friend-item"><span>${k} x${inventory[k]}</span><button class="btn-primary" style="width:auto;padding:5px 10px" onclick="useItem('${k}')">使用</button></div>`;
            });
        }

        // --- 地圖區 ---
        const map = L.map('map').setView([23.6, 121], 7);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        let waypoints = [];
        map.on('click', e => {
            const m = L.marker(e.latlng).addTo(map);
            waypoints.push({ m, lat: e.latlng.lat, lng: e.latlng.lng, visited: false });
            updateGPSDropdown();
        });

        function updateGPSDropdown() {
            const s = document.getElementById('gps-waypoint-select');
            s.innerHTML = waypoints.map((w,i)=>`<option value="${i}">${w.visited?'[已領]':'[未到]'} 景點 ${i+1}</option>`).join('');
            s.disabled = false;
            updateGPSButtonState();
        }

        function updateGPSButtonState() {
            const i = document.getElementById('gps-waypoint-select').value;
            const b = document.getElementById('btn-gps-arrive');
            if(waypoints[i] && !waypoints[i].visited) { b.disabled = false; b.style.background = '#55a846'; }
            else { b.disabled = true; b.style.background = '#aaa'; }
        }

        function simulateArrivalAndReward() {
            const i = document.getElementById('gps-waypoint-select').value;
            waypoints[i].visited = true;
            userPoints += 50; userExp += 50;
            alert("結算成功！獲得 50 經驗與碳幣");
            syncDataToCloud(); updateGPSDropdown();
        }

        function clearMap() { waypoints.forEach(w=>map.removeLayer(w.m)); waypoints=[]; updateGPSDropdown(); }

        // 其他彈窗
        function openModal(id) { document.getElementById(id).style.display='flex'; }
        function closeModal(id) { document.getElementById(id).style.display='none'; }
        function openLeaderboard() { 
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = `<div class="rank-item"><span>1. 減碳大神</span><span>99 LV</span></div><div class="rank-item"><span>2. 你</span><span>${document.getElementById('mascot-name').innerText}</span></div>`;
            openModal('leaderboard-modal'); 
        }
        function openFriends() { openModal('friends-modal'); }

        // 初始化
        loadLocalData();
        renderShop();
    </script>
</body>
</html>
